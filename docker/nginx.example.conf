# Institution supplies the real domain, certificate and key outside this repository.
server {
    listen 443 ssl;
    server_name kiosk.example.go.id;
    ssl_certificate /etc/nginx/tls/kiosk.crt;
    ssl_certificate_key /etc/nginx/tls/kiosk.key;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        client_max_body_size 512k;
    }
}
