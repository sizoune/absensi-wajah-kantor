name: Windows distribution
on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag matching app_version.py (e.g. v1.0.0)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.24'
      - name: Prepare private CPython
        shell: powershell
        run: |
          uv python install cpython-3.11.17-windows-x86_64-none --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { throw 'Runtime Python gagal disiapkan.' }
          uv venv --python 3.11.17 --managed-python .build-venv
          if ($LASTEXITCODE -ne 0) { throw 'Lingkungan tes gagal disiapkan.' }
          (Join-Path $env:GITHUB_WORKSPACE '.build-venv\Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install locked wheels
        run: 'uv pip install --python .build-venv/Scripts/python.exe --require-hashes --only-binary=:all: -r requirements-windows.lock'
      - name: Regression tests
        run: python -m pytest -q -x
      - name: Update controls regression
        run: node tests/app_updates_ui.test.cjs
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.24'
      - name: Prepare private CPython
        shell: powershell
        run: |
          uv python install cpython-3.11.17-windows-x86_64-none --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { throw 'Runtime Python gagal disiapkan.' }
          uv venv --python 3.11.17 --managed-python .build-venv
          if ($LASTEXITCODE -ne 0) { throw 'Lingkungan build gagal disiapkan.' }
          (Join-Path $env:GITHUB_WORKSPACE '.build-venv\Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install locked wheels
        run: 'uv pip install --python .build-venv/Scripts/python.exe --require-hashes --only-binary=:all: -r requirements-windows.lock'
      - name: Build and exercise frozen executable
        shell: powershell
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            ./scripts/build_windows.ps1 -TestKey
          } else {
            ./scripts/build_windows.ps1
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-distribution
          path: |
            dist/release/
            build/build-info.json
            distribution/update-public-key.bin
          if-no-files-found: error
  draft-release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [regression, build]
    runs-on: windows-2022
    environment: windows-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.24'
      - name: Prepare private CPython
        shell: powershell
        run: |
          uv python install cpython-3.11.17-windows-x86_64-none --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { throw 'Runtime Python gagal disiapkan.' }
          uv venv --python 3.11.17 --managed-python .build-venv
          if ($LASTEXITCODE -ne 0) { throw 'Lingkungan signing gagal disiapkan.' }
          (Join-Path $env:GITHUB_WORKSPACE '.build-venv\Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-distribution
          path: .
      - run: 'uv pip install --python .build-venv/Scripts/python.exe --require-hashes --only-binary=:all: -r requirements-windows.lock'
      - name: Sign release metadata
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release_windows.py
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: powershell
        run: |
          gh release create $env:RELEASE_TAG dist/release/AbsensiSetup.exe dist/release/windows-x64.zip dist/release/update.json dist/release/update.json.sig --repo sizoune/absensi-wajah-kantor --draft --verify-tag --title $env:RELEASE_TAG --notes-file distribution/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release gagal dibuat; tidak ada publikasi otomatis.' }
